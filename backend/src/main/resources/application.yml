# Every value that differs between environments, and every secret, comes from an environment variable.
# The defaults after the colon are safe for local development only.
spring:
  application:
    name: claims-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/claims}
    username: ${DB_USERNAME:claims}
    password: ${DB_PASSWORD:claims-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks that the entities match it.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

claims:
  security:
    jwt-secret: ${JWT_SECRET:local-development-signing-key-change-me-0123456789}
    token-ttl: PT1H
  messaging:
    topic: claims.claim-events.v1
    dead-letter-topic: claims.claim-events.v1.DLT
    consumer-group: claims-exposure-projector
    outbox-poll-interval: 500ms
    outbox-batch-size: 50
    send-timeout: 5s
