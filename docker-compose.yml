# Starts the whole stack with one command: docker compose up --build
# Open http://localhost:4200 and sign in with a demo user from the README.
#
# Every value can be overridden from the environment or a local .env file (see .env.example); the defaults are safe
# for local use only. Only the web app and the API are published to the host, so a local PostgreSQL or Kafka on the
# usual ports cannot clash with this stack. Data is not kept between runs (NOTES.md, D19).

name: chubb-claims

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-claims}
      POSTGRES_USER: ${POSTGRES_USER:-claims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claims-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    # The GraalVM native build of Apache Kafka starts in about a second; it is the image the integration tests use.
    image: apache/kafka-native:4.2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-claims}
      DB_USERNAME: ${POSTGRES_USER:-claims}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-claims-local-only}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-local-development-signing-key-change-me-0123456789}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-Demo-Passw0rd!}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 40

  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
