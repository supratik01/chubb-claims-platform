server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The API is served from the same origin, so the browser needs no CORS configuration.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Files that say where everything is must never be cached, or a redeployed micro-frontend would be missed.
    location ~ (federation\.manifest\.json|remoteEntry\.json|importmap\.json|index\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Micro-frontend bundles: file names carry a content hash.
    location /mfe/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The shell is a single-page application: unknown paths are routes, so serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
