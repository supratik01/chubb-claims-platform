<a class="skip-link" href="#main" (click)="skipToMain($event)">Skip to main content</a>

<header class="header">
  <div class="header__inner">
    <a class="brand" routerLink="/">
      <span class="brand__mark" aria-hidden="true">◆</span>
      APAC Claims
    </a>

    @if (user(); as user) {
      <nav class="nav" aria-label="Main">
        <ul>
          @for (link of links(); track link.path) {
            <li>
              <a
                [routerLink]="link.path"
                routerLinkActive="nav__link--active"
                [routerLinkActiveOptions]="{ exact: link.exact }"
                ariaCurrentWhenActive="page"
                class="nav__link"
                >{{ link.label }}</a
              >
            </li>
          }
        </ul>
      </nav>

      <div class="account">
        <span class="account__name">
          {{ user.displayName }}
          <span class="account__role">{{ roleLabel() }}</span>
        </span>
        <button
          type="button"
          class="cc-button cc-button--secondary account__signout"
          (click)="signOut()"
        >
          Sign out
        </button>
      </div>
    }
  </div>
</header>

<main id="main" #main tabindex="-1" class="main">
  <router-outlet />
</main>
